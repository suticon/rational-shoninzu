<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>承認図ファインダー</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1b1f27;
    --navy: #1b2a4a;
    --muted: #6b7280;
    --border: #e3e6ec;
    --accent: #e2001a;
    --accent-bg: #fdecee;
    --chip-bg: #eef1f5;
    --chip-active-bg: #e2001a;
    --chip-active-text: #ffffff;
    --shadow: 0 1px 3px rgba(20,24,33,.06);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- ヘッダー ---------- */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .header-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  h1 { font-size: 1.05rem; margin: 0; color: var(--navy); }
  .sub { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
  .logo { flex: none; height: 30px; width: auto; display: block; }
  .logo-fallback {
    flex: none;
    display: flex; align-items: center; gap: 5px;
    border: 1.5px solid var(--accent); border-radius: 5px;
    padding: 4px 9px; font-weight: 800; font-size: .8rem;
    color: var(--navy); letter-spacing: .02em;
  }
  .logo-fallback::before {
    content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--accent);
  }

  /* ---------- レイアウト ---------- */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 14px 16px 120px; }
  .cols { display: block; }
  @media (min-width: 900px) {
    .cols { display: grid; grid-template-columns: 330px 1fr; gap: 24px; align-items: start; }
    .col-filters { position: sticky; top: 68px; max-height: calc(100vh - 88px); overflow-y: auto; }
    .wrap { padding-bottom: 40px; }
  }

  /* ---------- カテゴリタブ ---------- */
  .cats { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .cat-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 9px 15px; border-radius: 8px; font-size: .87rem; font-weight: 600;
    cursor: pointer; min-height: 42px;
  }
  .cat-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }

  /* ---------- 絞り込み ---------- */
  .filter-card {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 4px solid var(--accent); border-radius: 10px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .filter-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 12px;
  }
  .filter-head b { font-size: .88rem; }
  .clear-btn {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    font-size: .74rem; padding: 4px 10px; border-radius: 999px; cursor: pointer;
  }
  .clear-btn:disabled { opacity: .4; cursor: default; }
  .chipgroup { margin-bottom: 13px; }
  .chipgroup:last-child { margin-bottom: 0; }
  .chipgroup-label { font-size: .72rem; color: var(--muted); margin-bottom: 6px; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--border); background: var(--chip-bg); color: var(--text);
    padding: 7px 12px; border-radius: 999px; font-size: .8rem; cursor: pointer;
    min-height: 34px;
  }
  .chip.active {
    background: var(--chip-active-bg); color: var(--chip-active-text);
    border-color: var(--chip-active-bg); font-weight: 600;
  }
  .hint { font-size: .7rem; color: var(--muted); margin: 8px 0 0; }

  /* ---------- 検索 ---------- */
  #search {
    width: 100%; padding: 10px 13px; font-size: 16px; margin-bottom: 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
  }

  /* ---------- 結果 ---------- */
  .results-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin: 18px 0 8px;
  }
  @media (min-width: 900px) { .results-head { margin-top: 0; } }
  .results-head b { font-size: .9rem; }
  .results-head .count { font-size: .76rem; color: var(--muted); }
  .notice {
    border: 1px dashed var(--border); border-radius: 10px;
    padding: 28px 18px; text-align: center; color: var(--muted); font-size: .82rem;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow);
  }
  .row.checked { border-color: var(--accent); background: var(--accent-bg); }
  .row input[type="checkbox"] { width: 20px; height: 20px; flex: none; cursor: pointer; accent-color: var(--accent); }
  .row-body { flex: 1; min-width: 0; }
  .row-name {
    font-size: .83rem; font-weight: 600; word-break: break-word;
    text-decoration: none; color: inherit; display: block;
  }
  .row-name:hover { color: var(--accent); text-decoration: underline; }
  .row-meta { font-size: .71rem; color: var(--muted); margin-top: 2px; }
  .row-actions { flex: none; display: flex; gap: 6px; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    width: 34px; height: 34px; border-radius: 7px; font-size: .95rem; cursor: pointer;
    display: none;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  @media (min-width: 900px) { .icon-btn { display: block; } }
  .more-note {
    font-size: .76rem; color: var(--muted); text-align: center;
    padding: 12px; border: 1px dashed var(--border); border-radius: 10px;
  }

  /* ---------- 送信バー ---------- */
  .sharebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--border);
    box-shadow: 0 -2px 14px rgba(20,24,33,.1);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .sharebar-inner {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .share-count { font-size: .82rem; font-weight: 700; white-space: nowrap; }
  .share-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-left: auto; }
  .share-btn {
    border: 1px solid var(--border); background: var(--chip-bg); color: var(--text);
    padding: 8px 14px; border-radius: 999px; font-size: .8rem; cursor: pointer;
    min-height: 40px;
  }
  .share-btn.primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  .share-btn.ghost { background: transparent; color: var(--muted); }
  .share-btn:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>承認図ファインダー</h1>
      <div class="sub">Rational 承認図PDF 検索ツール（<span id="total-count">0</span> 件収録）</div>
    </div>
    <!-- logo.png を同じ階層に置くと自動でロゴが表示されます -->
    <img class="logo" src="logo.png" alt="RATIONAL"
         onerror="this.outerHTML='&lt;div class=\'logo-fallback\'&gt;RATIONAL&lt;/div&gt;'">
  </div>
</header>

<div class="wrap">
  <div class="cats" id="cats"></div>

  <div class="cols">
    <div class="col-filters">
      <input type="text" id="search" placeholder="ファイル名で検索（例: 6-11 UltraVent）">
      <div class="filter-card">
        <div class="filter-head">
          <b>絞り込み</b>
          <button type="button" class="clear-btn" id="clear-filters" disabled>条件をクリア</button>
        </div>
        <div id="filters"></div>
        <p class="hint">選択中の項目をもう一度タップすると解除されます</p>
      </div>
    </div>

    <div class="col-results">
      <div class="results-head">
        <b>該当する承認図</b>
        <span class="count" id="result-count"></span>
      </div>
      <div id="results"></div>
    </div>
  </div>
</div>

<div class="sharebar" id="sharebar" style="display:none;">
  <div class="sharebar-inner">
    <span class="share-count"><span id="sel-count">0</span> 件選択中</span>
    <div class="share-actions">
      <button type="button" class="share-btn primary" id="btn-share">📤 共有</button>
      <button type="button" class="share-btn" id="btn-mail">✉️ メール</button>
      <button type="button" class="share-btn" id="btn-line">💬 LINE</button>
      <button type="button" class="share-btn" id="btn-sms">📱 SMS</button>
      <button type="button" class="share-btn" id="btn-download">⬇ ダウンロード</button>
      <button type="button" class="share-btn ghost" id="btn-clear-sel">✕ 解除</button>
    </div>
  </div>
</div>

// ============================================================
// カテゴリごとの絞り込み項目（順番は一覧表のExcelに合わせている）
// ============================================================
const CATEGORIES = ["単品", "Combi-Duo", "iVario", "架台", "アクセサリー"];

const FILTER_DEFS = {
  "単品": [
    { key: "m", label: "モデル" },
    { key: "s", label: "サイズ" },
    { key: "e", label: "動力" },
    { key: "d", label: "扉の向き" },
    { key: "o", label: "オプション", multi: true },
    { key: "v", label: "UltraVent" },
    { key: "g", label: "架台" },
  ],
  "Combi-Duo": [
    { key: "m", label: "モデル" },
    { key: "s", label: "サイズ（上段＋下段）" },
    { key: "e", label: "動力" },
    { key: "d", label: "扉の向き" },
    { key: "o", label: "オプション", multi: true },
    { key: "v", label: "UltraVent" },
    { key: "g", label: "架台" },
  ],
  "iVario": [
    { key: "s", label: "サイズ" },
    { key: "st", label: "架台" },
  ],
  "架台": [
    { key: "sT", label: "架台タイプ" },
    { key: "fm", label: "対応機種" },
    { key: "ft", label: "脚" },
  ],
  "アクセサリー": [],
};

// サイズ・架台などをきれいな順番で並べるための優先度
const SIZE_ORDER = ["XS 6-23", "6-11", "6-21", "10-11", "10-21", "20-11", "20-21"];
const STAND_ORDER = ["なし（本体のみ）", "UG I", "UG II", "UG III", "UG IV", "UG XS"];
const MAX_ROWS = 20;

const state = { cat: "単品", query: "", filters: {}, selected: new Set() };

// ------------------------------------------------------------ ヘルパー
const inCat = () => DRAWINGS.filter(r => r.c === state.cat);

function valuesOf(rec, key) {
  const v = rec[key];
  if (v === undefined || v === null || v === "") return [];
  return Array.isArray(v) ? v : [v];
}

function sortValues(key, vals) {
  const order = key === "s" ? SIZE_ORDER : (key === "g" ? STAND_ORDER : null);
  return vals.sort((a, b) => {
    if (order) {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    }
    return a.localeCompare(b, "ja");
  });
}

/** 動力は上下段で違う場合があるので ef（配列）も見る */
function recMatchesValue(rec, key, val) {
  if (key === "e" && rec.ef) return rec.ef.includes(val);
  return valuesOf(rec, key).includes(val);
}

function matches(rec, ignoreKey) {
  for (const [key, sel] of Object.entries(state.filters)) {
    if (key === ignoreKey) continue;
    const chosen = [...sel];
    if (chosen.length === 0) continue;
    const def = (FILTER_DEFS[state.cat] || []).find(d => d.key === key);
    if (def && def.multi) {
      // オプションは選んだものを「すべて」含むレコードだけ残す
      if (!chosen.every(v => recMatchesValue(rec, key, v))) return false;
    } else if (!chosen.some(v => recMatchesValue(rec, key, v))) {
      return false;
    }
  }
  if (state.query) {
    const hay = (rec.f + " " + (rec.n || "")).toLowerCase();
    if (!state.query.split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

const filtered = () => inCat().filter(r => matches(r));
const hasActiveFilter = () => Object.values(state.filters).some(s => s.size > 0);

// ------------------------------------------------------------ 描画
function renderCats() {
  const wrap = document.getElementById("cats");
  wrap.innerHTML = CATEGORIES
    .filter(c => DRAWINGS.some(r => r.c === c))
    .map(c => {
      const n = DRAWINGS.filter(r => r.c === c).length;
      return `<button type="button" class="cat-btn${c === state.cat ? " active" : ""}" data-cat="${c}">${c} (${n})</button>`;
    }).join("");
}

function renderFilters() {
  const defs = FILTER_DEFS[state.cat] || [];
  const wrap = document.getElementById("filters");
  const base = inCat();

  const html = defs.map(def => {
    // その項目以外の条件を適用した結果から選択肢を作る（0件になる選択肢は出さない）
    const pool = base.filter(r => matches(r, def.key));
    const counts = new Map();
    for (const r of pool) for (const v of valuesOf(r, def.key)) counts.set(v, (counts.get(v) || 0) + 1);

    const sel = state.filters[def.key] || new Set();
    for (const v of sel) if (!counts.has(v)) counts.set(v, 0);
    if (counts.size === 0) return "";

    const chips = sortValues(def.key, [...counts.keys()]).map(v => {
      const active = sel.has(v);
      return `<button type="button" class="chip${active ? " active" : ""}" data-key="${def.key}" data-val="${escapeAttr(v)}">${escapeHtml(v)} (${counts.get(v)})</button>`;
    }).join("");

    return `<div class="chipgroup">
      <div class="chipgroup-label">${def.label}</div>
      <div class="chiprow">${chips}</div>
    </div>`;
  }).join("");

  wrap.innerHTML = html || `<p class="hint" style="margin:0;">このカテゴリは絞り込み項目がありません。下の一覧からお選びください。</p>`;
  document.getElementById("clear-filters").disabled = !hasActiveFilter() && !state.query;
}

function metaLine(rec) {
  const parts = [];
  if (rec.c === "Combi-Duo" && rec.u && rec.l) parts.push(`上: ${rec.u} ／ 下: ${rec.l}`);
  else {
    if (rec.m) parts.push(rec.m);
    if (rec.s) parts.push(rec.s);
    if (rec.e) parts.push(rec.e);
  }
  if (rec.d === "逆扉") parts.push("逆扉");
  if (rec.v) parts.push(rec.v);
  if (rec.o && rec.o.length) parts.push(rec.o.join("・"));
  if (rec.st) parts.push(`架台: ${rec.st}`);
  else if (rec.sT) parts.push(`${rec.sT}${rec.h ? ` (${rec.h}mm)` : ""}`);
  if (rec.fm) parts.push(`対応: ${rec.fm}`);
  if (rec.ft) parts.push(rec.ft);
  return parts.join(" ／ ");
}

function renderResults() {
  const list = filtered();
  const box = document.getElementById("results");
  const countEl = document.getElementById("result-count");
  countEl.textContent = list.length ? `${list.length} 件` : "";

  if (!hasActiveFilter() && !state.query && list.length > MAX_ROWS) {
    box.innerHTML = `<div class="notice">上の条件を選ぶと、該当する承認図がここに表示されます<br>（このカテゴリには ${list.length} 件あります）</div>`;
    return;
  }
  if (list.length === 0) {
    box.innerHTML = `<div class="notice">条件に合う承認図が見つかりませんでした。<br>条件を減らしてお試しください。</div>`;
    return;
  }

  const shown = list.slice(0, MAX_ROWS);
  box.innerHTML = shown.map(rec => {
    const checked = state.selected.has(rec.f);
    const title = rec.n || rec.f.replace(/\.pdf$/i, "");
    return `<div class="row${checked ? " checked" : ""}">
      <input type="checkbox" data-file="${escapeAttr(rec.f)}" ${checked ? "checked" : ""} aria-label="${escapeAttr(title)} を選択">
      <div class="row-body">
        <a class="row-name" href="pdf/${encodeURIComponent(rec.f)}" target="_blank" rel="noopener">${escapeHtml(title)}</a>
        <div class="row-meta">${escapeHtml(metaLine(rec))}</div>
      </div>
      <div class="row-actions">
        <button type="button" class="icon-btn" data-dl="${escapeAttr(rec.f)}" title="ダウンロード">⬇</button>
      </div>
    </div>`;
  }).join("") + (list.length > MAX_ROWS
    ? `<div class="more-note">上位 ${MAX_ROWS} 件を表示しています（全 ${list.length} 件）。条件を追加して絞り込んでください。</div>`
    : "");
}

function renderShareBar() {
  const n = state.selected.size;
  document.getElementById("sel-count").textContent = n;
  document.getElementById("sharebar").style.display = n > 0 ? "block" : "none";
}

function render() {
  renderCats();
  renderFilters();
  renderResults();
  renderShareBar();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const escapeAttr = escapeHtml;

// ------------------------------------------------------------ 操作
document.getElementById("cats").addEventListener("click", e => {
  const btn = e.target.closest(".cat-btn");
  if (!btn) return;
  state.cat = btn.dataset.cat;
  state.filters = {};
  render();
});

document.getElementById("filters").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const { key, val } = chip.dataset;
  const def = (FILTER_DEFS[state.cat] || []).find(d => d.key === key);
  const sel = state.filters[key] || (state.filters[key] = new Set());
  if (sel.has(val)) sel.delete(val);
  else if (def && def.multi) sel.add(val);
  else { sel.clear(); sel.add(val); }   // 単一選択の項目は選び直しで置き換え
  render();
});

document.getElementById("clear-filters").addEventListener("click", () => {
  state.filters = {};
  state.query = "";
  document.getElementById("search").value = "";
  render();
});

document.getElementById("search").addEventListener("input", e => {
  state.query = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById("results").addEventListener("change", e => {
  const cb = e.target.closest('input[type="checkbox"]');
  if (!cb) return;
  if (cb.checked) state.selected.add(cb.dataset.file);
  else state.selected.delete(cb.dataset.file);
  cb.closest(".row").classList.toggle("checked", cb.checked);
  renderShareBar();
});

document.getElementById("results").addEventListener("click", e => {
  const btn = e.target.closest("[data-dl]");
  if (!btn) return;
  downloadFiles([btn.dataset.dl]);
});

// ------------------------------------------------------------ 共有・ダウンロード
const selectedFiles = () => [...state.selected];
const absUrl = f => new URL("pdf/" + encodeURIComponent(f), location.href).href;
const titleOf = f => f.replace(/\.pdf$/i, "");

function shareText(files) {
  const body = files.map(f => `${titleOf(f)}\n${absUrl(f)}`).join("\n\n");
  return `承認図をお送りします。\n\n${body}`;
}

function downloadFiles(files) {
  files.forEach((f, i) => {
    setTimeout(() => {
      const a = document.createElement("a");
      a.href = "pdf/" + encodeURIComponent(f);
      a.download = f;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, i * 300);   // 連続ダウンロードがブラウザにブロックされないよう間隔をあける
  });
}

async function webShare() {
  const files = selectedFiles();
  if (!files.length) return;
  const btn = document.getElementById("btn-share");
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "準備中...";
  try {
    let data = null;
    if (navigator.canShare) {
      try {
        const blobs = [];
        for (const f of files) {
          const res = await fetch("pdf/" + encodeURIComponent(f));
          if (!res.ok) throw new Error(f);
          blobs.push(new File([await res.blob()], f, { type: "application/pdf" }));
        }
        if (navigator.canShare({ files: blobs })) {
          data = { files: blobs, title: "承認図", text: shareText(files) };
        }
      } catch (_) {
        // PDF本体を渡せない環境ではリンク共有に切り替える
      }
    }
    await navigator.share(data || { title: "承認図", text: shareText(files) });
  } catch (err) {
    if (err && err.name !== "AbortError") {
      alert("共有できませんでした。メール / LINE / SMS のボタンをお試しください。");
    }
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

document.getElementById("btn-share").addEventListener("click", webShare);

document.getElementById("btn-mail").addEventListener("click", () => {
  const files = selectedFiles();
  if (!files.length) return;
  const subject = encodeURIComponent(`承認図のご送付（${files.length}件）`);
  location.href = `mailto:?subject=${subject}&body=${encodeURIComponent(shareText(files))}`;
});

document.getElementById("btn-line").addEventListener("click", () => {
  const files = selectedFiles();
  if (!files.length) return;
  window.open(`https://line.me/R/msg/text/?${encodeURIComponent(shareText(files))}`, "_blank", "noopener");
});

document.getElementById("btn-sms").addEventListener("click", () => {
  const files = selectedFiles();
  if (!files.length) return;
  const text = encodeURIComponent(shareText(files));
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
  location.href = isIOS ? `sms:&body=${text}` : `sms:?body=${text}`;
});

document.getElementById("btn-download").addEventListener("click", () => downloadFiles(selectedFiles()));

document.getElementById("btn-clear-sel").addEventListener("click", () => {
  state.selected.clear();
  render();
});

// ------------------------------------------------------------ 起動
if (!navigator.share) document.getElementById("btn-share").style.display = "none";
document.getElementById("total-count").textContent = DRAWINGS.length;
render();
</script>
