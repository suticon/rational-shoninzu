<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>承認図ファインダー</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1b1f27;
    --navy: #1b2a4a;
    --muted: #6b7280;
    --border: #e3e6ec;
    --accent: #e2001a;
    --accent-bg: #fdecee;
    --rail: #9aa3ad;          /* 絞り込みカード左のライン（メタリックグレー） */
    --chip-bg: #eef1f5;
    --chip-active-bg: #e2001a;
    --chip-active-text: #ffffff;
    --shadow: 0 1px 3px rgba(20,24,33,.06);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- ヘッダー ---------- */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .header-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  h1 { font-size: 1.7rem; margin: 0; color: var(--navy); line-height: 1.15; letter-spacing: .01em; }
  .sub { font-size: 0.828rem; color: var(--muted); margin-top: 4px; }
  .logo { flex: none; height: 30px; width: auto; display: block; }
  .logo-fallback {
    flex: none;
    display: flex; align-items: center; gap: 5px;
    border: 1.5px solid var(--accent); border-radius: 5px;
    padding: 4px 9px; font-weight: 800; font-size: 0.92rem;
    color: var(--navy); letter-spacing: .02em;
  }
  .logo-fallback::before {
    content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--accent);
  }

  /* ---------- レイアウト ---------- */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 14px 16px 120px; }
  .cols { display: block; }
  @media (min-width: 900px) {
    .cols { display: grid; grid-template-columns: 330px 1fr; gap: 24px; align-items: start; }
    .col-filters { position: sticky; top: 68px; max-height: calc(100vh - 88px); overflow-y: auto; }
    .wrap { padding-bottom: 40px; }
  }

  /* ---------- カテゴリタブ ---------- */
  .cats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }
  .cat-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 10px; padding: 10px 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 0.897rem; font-weight: 600; line-height: 1.25; text-align: center;
  }
  .cat-btn .thumb {
    width: 100%; height: 70px;
    background: #fff;                     /* 画像の背景を白で統一する */
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .cat-btn .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .cat-btn .cat-count { font-weight: 500; color: var(--muted); font-size: 0.828rem; }
  .cat-btn.active {
    background: var(--navy); border-color: var(--navy); color: #fff;
  }
  .cat-btn.active .cat-count { color: rgba(255,255,255,.75); }

  /* ---------- 絞り込み ---------- */
  .filter-card {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 4px solid var(--rail); border-radius: 10px;
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .filter-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 12px;
  }
  .filter-head b { font-size: 1.012rem; }
  .clear-btn {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    font-size: 0.851rem; padding: 4px 10px; border-radius: 999px; cursor: pointer;
  }
  .clear-btn:disabled { opacity: .4; cursor: default; }
  .chipgroup { margin-bottom: 13px; }
  .chipgroup:last-child { margin-bottom: 0; }
  .chipgroup-label { font-size: 0.828rem; color: var(--muted); margin-bottom: 6px; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--border); background: var(--chip-bg); color: var(--text);
    padding: 7px 12px; border-radius: 999px; font-size: 0.92rem; cursor: pointer;
    min-height: 34px;
  }
  .chip.active {
    background: var(--chip-active-bg); color: var(--chip-active-text);
    border-color: var(--chip-active-bg); font-weight: 600;
  }
  /* 説明を添えたい項目（架台など）は縦1列に並べる */
  .chiprow.stacked { flex-direction: column; align-items: stretch; }
  .chiprow.stacked .chip {
    border-radius: 8px; text-align: left; padding: 8px 12px;
    display: flex; flex-direction: column; gap: 1px;
  }
  /* 説明文は \n で改行できるようにする */
  .chip .chip-desc { font-size: 0.782rem; font-weight: 400; opacity: .72; white-space: pre-line; }
  .hint { font-size: 0.805rem; color: var(--muted); margin: 8px 0 0; }

  /* ---------- 検索 ---------- */
  #search {
    width: 100%; padding: 10px 13px; font-size: 16px; margin-bottom: 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text);
  }

  /* ---------- 結果 ---------- */
  .results-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin: 18px 0 8px;
  }
  @media (min-width: 900px) { .results-head { margin-top: 0; } }
  .results-head b { font-size: 1.035rem; }
  .results-head .count { font-size: 0.874rem; color: var(--muted); }
  .notice {
    border: 1px dashed var(--border); border-radius: 10px;
    padding: 28px 18px; text-align: center; color: var(--muted); font-size: 0.943rem;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow);
  }
  .row.checked { border-color: var(--accent); background: var(--accent-bg); }
  .row input[type="checkbox"] { width: 20px; height: 20px; flex: none; cursor: pointer; accent-color: var(--accent); }
  .row-body { flex: 1; min-width: 0; }
  .row-name {
    font-size: 0.954rem; font-weight: 600; word-break: break-word;
    text-decoration: none; color: inherit; display: block;
  }
  .row-name:hover { color: var(--accent); text-decoration: underline; }
  .row-meta { font-size: 0.816rem; color: var(--muted); margin-top: 2px; }
  .row-actions { flex: none; display: flex; gap: 6px; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    width: 34px; height: 34px; border-radius: 7px; font-size: 1.092rem; cursor: pointer;
    display: none;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  @media (min-width: 900px) { .icon-btn { display: block; } }
  .more-note {
    font-size: 0.874rem; color: var(--muted); text-align: center;
    padding: 12px; border: 1px dashed var(--border); border-radius: 10px;
  }

  /* ---------- 送信バー ---------- */
  .sharebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--border);
    box-shadow: 0 -2px 14px rgba(20,24,33,.1);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .sharebar-inner {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .share-count { font-size: 0.943rem; font-weight: 700; white-space: nowrap; }
  .share-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-left: auto; }
  .share-btn {
    border: 1px solid var(--border); background: var(--chip-bg); color: var(--text);
    padding: 8px 14px; border-radius: 999px; font-size: 0.92rem; cursor: pointer;
    min-height: 40px;
  }
  .share-btn.primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  .share-btn.ghost { background: transparent; color: var(--muted); }
  .share-btn:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>RATIONAL<br>クイックリサーチ</h1>
      <div class="sub">承認図PDF 検索ツール（<span id="total-count">0</span> 件収録）</div>
    </div>
    <!-- ロゴ画像はHTMLに埋め込み済み（下の IMAGES を参照） -->
    <img class="logo" id="logo-img" alt="RATIONAL">
  </div>
</header>

<div class="wrap">
  <div class="cats" id="cats"></div>

  <div class="cols">
    <div class="col-filters">
      <input type="text" id="search" placeholder="ファイル名で検索（例: 6-11 UltraVent）">
      <div class="filter-card">
        <div class="filter-head">
          <b>絞り込み</b>
          <button type="button" class="clear-btn" id="clear-filters" disabled>条件をクリア</button>
        </div>
        <div id="filters"></div>
        <p class="hint">選択中の項目をもう一度タップすると解除されます</p>
      </div>
    </div>

    <div class="col-results">
      <div class="results-head">
        <b>該当する承認図</b>
        <span class="count" id="result-count"></span>
      </div>
      <div id="results"></div>
    </div>
  </div>
</div>

<div class="sharebar" id="sharebar" style="display:none;">
  <div class="sharebar-inner">
    <span class="share-count"><span id="sel-count">0</span> 件選択中</span>
    <div class="share-actions">
      <button type="button" class="share-btn primary" id="btn-mail">✉️ メールで送る</button>
      <button type="button" class="share-btn" id="btn-share">📤 その他共有する</button>
      <button type="button" class="share-btn" id="btn-download">⬇ 保存する</button>
      <button type="button" class="share-btn ghost" id="btn-clear-sel">✕ 解除</button>
    </div>
  </div>
</div>

// required : これを選び終えるまで一覧を出さない
// additive : 選ばなければ「その装備が付いていない図面」だけを残す（＝初期値は「なし」）
const FILTER_DEFS = {
  "単品": [
    { key: "m", label: "モデル", required: true },
    { key: "s", label: "サイズ", required: true },
    { key: "e", label: "動力", required: true },

  ],

    { key: "s", label: "サイズ（上段＋下段）", required: true },
    { key: "e", label: "動力", required: true },

    { key: "o", label: "オプション", multi: true, additive: true },

  ],

  ],

  ],

      desc: { "モービルオーブンラック": "20段用追加カート" } },
  ],

// サイズ・架台などをきれいな順番で並べるための優先度
const MODEL_ORDER = ["iCombi Pro", "iCombi Classic"];
// RATIONAL 社内で決まっているサイズの並び順（恒久ルール）
const SIZE_ORDER = [
  "XS 6-2/3", "6-1/1", "10-1/1", "6-2/1", "10-2/1", "20-1/1", "20-2/1",
  // Combi-Duo の上下段の組み合わせも同じ考え方で並べる
  "XS 6-2/3＋XS 6-2/3", "6-1/1＋6-1/1", "6-1/1＋10-1/1", "6-2/1＋6-2/1", "6-2/1＋10-2/1",
];
const FOR_MODEL_ORDER = ["XS 6-2/3", "6-1/1 or 10-1/1", "6-2/1 or 10-2/1"];
const FUEL_ORDER = ["電気", "ガス", "ガス／電気"];
const DOOR_ORDER = ["正扉", "逆扉"];
const STAND_ORDER = ["UG I", "UG II", "UG III", "UG IV", "UG XS", "DUO UG II",
                     "脚部付き基台", "平準設置キット"];
// 「なし」は各項目の最後に置く
const LAST_VALUES = new Set(["なし", "なし（本体のみ）"]);
const MAX_ROWS = 20;

const state = { cat: "単品", query: "", filters: {}, selected: new Set() };

// ------------------------------------------------------------ ヘルパー
const inCat = () => DRAWINGS.filter(r => r.c === state.cat);

function valuesOf(rec, key) {
  const v = rec[key];
  if (v === undefined || v === null || v === "") return [];
  return Array.isArray(v) ? v : [v];
}

function sortValues(key, vals) {
  const order = key === "s" ? SIZE_ORDER
    : key === "m" ? MODEL_ORDER
    : key === "e" ? FUEL_ORDER
    : key === "d" ? DOOR_ORDER
    : key === "fm" ? FOR_MODEL_ORDER
    : ((key === "g" || key === "sT") ? STAND_ORDER : null);
  return vals.sort((a, b) => {
    const la = LAST_VALUES.has(a), lb = LAST_VALUES.has(b);
    if (la !== lb) return la ? 1 : -1;      // 「なし」は常に末尾
    if (order) {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    }
    return a.localeCompare(b, "ja");
  });
}

function recMatchesValue(rec, key, val) {
  return valuesOf(rec, key).includes(val);
}

function matches(rec, ignoreKey, opts = {}) {
  for (const def of FILTER_DEFS[state.cat] || []) {
    if (def.key === ignoreKey) continue;
    const sel = state.filters[def.key];
    const chosen = sel ? [...sel] : [];

    if (chosen.length === 0) {
      // 追加装備を選んでいないときは「その装備が付いていない図面」だけを残す
      if (def.additive && !opts.ignoreAdditive && valuesOf(rec, def.key).length) return false;
      continue;
    }
    if (def.multi) {
      // オプションは選んだものを「すべて」含む図面だけ残す
      if (!chosen.every(v => recMatchesValue(rec, def.key, v))) return false;
    } else if (!chosen.some(v => recMatchesValue(rec, def.key, v))) {
      return false;
    }
  }
  if (state.query) {
    const hay = (rec.f + " " + (rec.n || "")).toLowerCase();
    if (!state.query.split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

const filtered = () => inCat().filter(r => matches(r));
const hasActiveFilter = () => Object.values(state.filters).some(s => s.size > 0);

/** まだ選ばれていない必須項目のラベル一覧を返す */
function pendingSteps() {
  return (FILTER_DEFS[state.cat] || [])
    .filter(d => d.required && !(state.filters[d.key] && state.filters[d.key].size))
    .map(d => d.label);
}

// ------------------------------------------------------------ 描画
function renderCats() {
  const wrap = document.getElementById("cats");
  wrap.innerHTML = CATEGORIES
    .filter(c => DRAWINGS.some(r => r.c === c.key))
    .map(c => {
      const n = DRAWINGS.filter(r => r.c === c.key).length;
      const src = IMAGES[c.img];
      return `<button type="button" class="cat-btn${c.key === state.cat ? " active" : ""}" data-cat="${escapeAttr(c.key)}">
        ${src ? `<span class="thumb"><img src="${src}" alt=""></span>` : ""}
        <span>${escapeHtml(c.label)}</span>
        <span class="cat-count">${n} 件</span>
      </button>`;
    }).join("");
}

function renderFilters() {
  const defs = FILTER_DEFS[state.cat] || [];
  const wrap = document.getElementById("filters");
  const base = inCat();

  const html = defs.map(def => {
    // その項目以外の条件を適用した結果から選択肢を作る（0件になる選択肢は出さない）
    const pool = base.filter(r => matches(r, def.key));
    const counts = new Map();
    for (const r of pool) for (const v of valuesOf(r, def.key)) counts.set(v, (counts.get(v) || 0) + 1);

    const sel = state.filters[def.key] || new Set();
    for (const v of sel) if (!counts.has(v)) counts.set(v, 0);
    if (counts.size === 0) return "";

    const chips = sortValues(def.key, [...counts.keys()]).map(v => {
      const active = sel.has(v);
      const desc = def.desc && def.desc[v];
      return `<button type="button" class="chip${active ? " active" : ""}" data-key="${def.key}" data-val="${escapeAttr(v)}">`
        + `<span>${escapeHtml(v)} (${counts.get(v)})</span>`
        + (desc ? `<span class="chip-desc">${escapeHtml(desc)}</span>` : "")
        + `</button>`;
    }).join("");

    return `<div class="chipgroup">
      <div class="chipgroup-label">${def.label}</div>
      <div class="chiprow${def.stacked ? " stacked" : ""}">${chips}</div>
    </div>`;
  }).join("");

  wrap.innerHTML = html || `<p class="hint" style="margin:0;">このカテゴリは絞り込み項目がありません。下の一覧からお選びください。</p>`;
  document.getElementById("clear-filters").disabled = !hasActiveFilter() && !state.query;
}

function metaLine(rec) {
  const parts = [];
  if (rec.c === "Combi-Duo" && rec.u && rec.l) parts.push(`上: ${rec.u} ／ 下: ${rec.l}`);
  else {
    if (rec.m) parts.push(rec.m);
    if (rec.s) parts.push(rec.s);
    if (rec.e) parts.push(rec.e);
  }
  if (rec.d === "逆扉") parts.push("逆扉");
  if (rec.v && rec.v !== "なし") parts.push(rec.v);
  const opts = (rec.o || []).filter(o => o !== "なし");
  if (opts.length) parts.push(opts.join("・"));
  if (rec.st) parts.push(`架台: ${rec.st}`);
  else if (rec.sT) parts.push(`${rec.sT}${rec.h ? ` (${rec.h}mm)` : ""}`);
  if (rec.fm) parts.push(`対応: ${rec.fm}`);
  if (rec.ft) parts.push(rec.ft);
  return parts.join(" ／ ");
}

function renderResults() {
  const list = filtered();
  const box = document.getElementById("results");
  const countEl = document.getElementById("result-count");
  countEl.textContent = list.length ? `${list.length} 件` : "";

  // 必須項目が残っていても、1件に絞り込めていればそのまま表示する
  const pending = pendingSteps();
  if (pending.length && list.length !== 1 && !state.query) {
    box.innerHTML = `<div class="notice">「${pending.join("」「")}」を選ぶと、該当する承認図が表示されます</div>`;
    return;
  }
  if (list.length === 0) {
    // 追加装備を外せば候補がある場合は、その旨を案内する
    const relaxed = inCat().filter(r => matches(r, null, { ignoreAdditive: true }));
    box.innerHTML = relaxed.length
      ? `<div class="notice">この条件の「装備なし」の承認図はありません。<br>「オプション」「UltraVent」から選ぶと ${relaxed.length} 件が表示されます。</div>`
      : `<div class="notice">条件に合う承認図が見つかりませんでした。<br>条件を減らしてお試しください。</div>`;
    return;
  }
  if (!hasActiveFilter() && !state.query && list.length > MAX_ROWS) {
    box.innerHTML = `<div class="notice">上の条件を選ぶと、該当する承認図がここに表示されます<br>（このカテゴリには ${list.length} 件あります）</div>`;
    return;
  }

  const shown = list.slice(0, MAX_ROWS);
  box.innerHTML = shown.map(rec => {
    const checked = state.selected.has(rec.f);
    const title = rec.n || rec.f.replace(/\.pdf$/i, "");
    return `<div class="row${checked ? " checked" : ""}">
      <input type="checkbox" data-file="${escapeAttr(rec.f)}" ${checked ? "checked" : ""} aria-label="${escapeAttr(title)} を選択">
      <div class="row-body">
        <a class="row-name" href="pdf/${encodeURIComponent(rec.f)}" target="_blank" rel="noopener">${escapeHtml(title)}</a>
        <div class="row-meta">${escapeHtml(metaLine(rec))}</div>
      </div>
      <div class="row-actions">
        <button type="button" class="icon-btn" data-dl="${escapeAttr(rec.f)}" title="ダウンロード">⬇</button>
      </div>
    </div>`;
  }).join("") + (list.length > MAX_ROWS
    ? `<div class="more-note">上位 ${MAX_ROWS} 件を表示しています（全 ${list.length} 件）。条件を追加して絞り込んでください。</div>`
    : "");
}

function renderShareBar() {
  const n = state.selected.size;
  document.getElementById("sel-count").textContent = n;
  document.getElementById("sharebar").style.display = n > 0 ? "block" : "none";
}

function render() {
  renderCats();
  renderFilters();
  renderResults();
  renderShareBar();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const escapeAttr = escapeHtml;

// ------------------------------------------------------------ 操作
document.getElementById("cats").addEventListener("click", e => {
  const btn = e.target.closest(".cat-btn");
  if (!btn) return;
  state.cat = btn.dataset.cat;
  state.filters = {};
  render();
});

document.getElementById("filters").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const { key, val } = chip.dataset;
  const def = (FILTER_DEFS[state.cat] || []).find(d => d.key === key);
  const sel = state.filters[key] || (state.filters[key] = new Set());
  if (sel.has(val)) sel.delete(val);
  else if (def && def.multi) {
    // 「なし」と個別オプションは同時に成立しないので排他にする
    if (val === "なし") sel.clear();
    else sel.delete("なし");
    sel.add(val);
  } else { sel.clear(); sel.add(val); }   // 単一選択の項目は選び直しで置き換え
  render();
});

document.getElementById("clear-filters").addEventListener("click", () => {
  state.filters = {};
  state.query = "";
  document.getElementById("search").value = "";
  render();
});

document.getElementById("search").addEventListener("input", e => {
  state.query = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById("results").addEventListener("change", e => {
  const cb = e.target.closest('input[type="checkbox"]');
  if (!cb) return;
  if (cb.checked) state.selected.add(cb.dataset.file);
  else state.selected.delete(cb.dataset.file);
  cb.closest(".row").classList.toggle("checked", cb.checked);
  renderShareBar();
});

document.getElementById("results").addEventListener("click", e => {
  const btn = e.target.closest("[data-dl]");
  if (!btn) return;
  downloadFiles([btn.dataset.dl]);
});

// ------------------------------------------------------------ 共有・ダウンロード
const selectedFiles = () => [...state.selected];
const absUrl = f => new URL("pdf/" + encodeURIComponent(f), location.href).href;
const titleOf = f => f.replace(/\.pdf$/i, "");

function shareText(files) {
  const body = files.map(f => `${titleOf(f)}\n${absUrl(f)}`).join("\n\n");
  return `承認図をお送りします。下記のリンクからご覧ください。\n\n${body}`;
}

function downloadFiles(files) {
  files.forEach((f, i) => {
    setTimeout(() => {
      const a = document.createElement("a");
      a.href = "pdf/" + encodeURIComponent(f);
      a.download = f;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, i * 300);   // 連続ダウンロードがブラウザにブロックされないよう間隔をあける
  });
}

/** 共有シートが使えない環境（主にPC）ではリンクをコピーする */
async function copyLinks(files) {
  const text = shareText(files);
  try {
    await navigator.clipboard.writeText(text);
    alert(`${files.length} 件のリンクをコピーしました。\nメールやチャットに貼り付けてください。`);
  } catch (_) {
    window.prompt("下のリンクをコピーしてお使いください", text);
  }
}

async function webShare() {
  const files = selectedFiles();
  if (!files.length) return;
  const btn = document.getElementById("btn-share");
  const label = btn.textContent;

  if (!navigator.share) { await copyLinks(files); return; }

  btn.disabled = true;
  btn.textContent = "準備中...";
  try {
    let data = null;
    if (navigator.canShare) {
      try {
        const blobs = [];
        for (const f of files) {
          const res = await fetch("pdf/" + encodeURIComponent(f));
          if (!res.ok) throw new Error(f);
          blobs.push(new File([await res.blob()], f, { type: "application/pdf" }));
        }
        if (navigator.canShare({ files: blobs })) {
          data = { files: blobs, title: "承認図", text: shareText(files) };
        }
      } catch (_) {
        // PDF本体を渡せない環境ではリンク共有に切り替える
      }
    }
    await navigator.share(data || { title: "承認図", text: shareText(files) });
  } catch (err) {
    if (err && err.name !== "AbortError") await copyLinks(files);
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

document.getElementById("btn-share").addEventListener("click", webShare);

document.getElementById("btn-mail").addEventListener("click", () => {
  const files = selectedFiles();
  if (!files.length) return;
  const subject = encodeURIComponent(`承認図のご送付（${files.length}件）`);
  location.href = `mailto:?subject=${subject}&body=${encodeURIComponent(shareText(files))}`;
});

document.getElementById("btn-download").addEventListener("click", () => downloadFiles(selectedFiles()));

document.getElementById("btn-clear-sel").addEventListener("click", () => {
  state.selected.clear();
  render();
});

// ------------------------------------------------------------ 起動
const logoEl = document.getElementById("logo-img");
if (IMAGES.logo) logoEl.src = IMAGES.logo;
else logoEl.outerHTML = '<div class="logo-fallback">RATIONAL</div>';

// 共有シートが無い環境ではリンクのコピーに切り替わるので、ボタンは常に出す
document.getElementById("total-count").textContent = DRAWINGS.length;
render();
</script>
